<?xml version="1.0" encoding="UTF-8"?>
<!-- GSOD 2027 brand mark — Obesity. Vector source; scales to any size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0c4a6e"/>
      <stop offset="55%"  stop-color="#001833"/>
      <stop offset="100%" stop-color="#001833"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#005EB8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#005EB8"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%"   stop-color="#005EB8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#005EB8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded tile -->
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#tile)"/>
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#hi)"/>
  <rect x="7" y="7" width="66" height="66" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>

  <!-- Accent ribbon (top-right) -->
  <path d="M 77 3 L 77 31 L 49 3 Z" fill="url(#acc)"/>
  <path d="M 77 3 L 77 31 L 49 3 Z" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.6"/>

  <!-- Soft radial glow -->
  <ellipse cx="40" cy="40" rx="22" ry="22" fill="url(#glow)"/>

  <!-- Scale/Balance -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="58" x2="40" y2="30"/>
    <line x1="28" y1="58" x2="52" y2="58"/>
    <line x1="20" y1="28" x2="60" y2="32"/>
    <path d="M 18 28 L 14 38 Q 20 42 26 38 L 22 28"/>
    <path d="M 58 32 L 54 42 Q 60 46 66 42 L 62 32"/>
    <circle cx="40" cy="30" r="4" fill="#ffffff"/>
  </g>

  <!-- Corner technical dots -->
  <circle cx="11" cy="11" r="1.2" fill="rgba(255,255,255,0.28)"/>
  <circle cx="11" cy="69" r="1.2" fill="rgba(255,255,255,0.18)"/>

  <!-- Initials chip -->
  <g transform="translate(44 57)">
    <rect x="0" y="0" width="28" height="16" rx="4.5" fill="rgba(0,0,0,0.42)" stroke="rgba(255,255,255,0.22)" stroke-width="0.6"/>
    <text x="14" y="12" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">GSOD</text>
  </g>
</svg>
