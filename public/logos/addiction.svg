<?xml version="1.0" encoding="UTF-8"?>
<!-- WCAM 2027 brand mark — Addiction Medicine. Vector source; scales to any size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#450a0a"/>
      <stop offset="55%"  stop-color="#1f0606"/>
      <stop offset="100%" stop-color="#1f0606"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7f1d1d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%"   stop-color="#7f1d1d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded tile -->
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#tile)"/>
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#hi)"/>
  <rect x="7" y="7" width="66" height="66" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>

  <!-- Accent ribbon (top-right) -->
  <path d="M 77 3 L 77 31 L 49 3 Z" fill="url(#acc)"/>
  <path d="M 77 3 L 77 31 L 49 3 Z" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.6"/>

  <!-- Soft radial glow -->
  <ellipse cx="40" cy="40" rx="22" ry="22" fill="url(#glow)"/>

  <!-- Brain with recovery symbol -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="1">
    <path d="M 28 35 Q 22 30 24 22 Q 28 14 40 14 Q 52 14 56 22 Q 58 30 52 35 Q 56 40 54 48 Q 50 54 40 54 Q 30 54 26 48 Q 24 40 28 35" fill="none" stroke-width="3"/>
    <path d="M 40 14 L 40 54" fill="none" stroke-width="2"/>
    <path d="M 32 24 Q 40 30 48 24" fill="none" stroke-width="2"/>
    <path d="M 30 38 Q 40 44 50 38" fill="none" stroke-width="2"/>
  </g>

  <!-- Corner technical dots -->
  <circle cx="11" cy="11" r="1.2" fill="rgba(255,255,255,0.28)"/>
  <circle cx="11" cy="69" r="1.2" fill="rgba(255,255,255,0.18)"/>

  <!-- Initials chip -->
  <g transform="translate(44 57)">
    <rect x="0" y="0" width="28" height="16" rx="4.5" fill="rgba(0,0,0,0.42)" stroke="rgba(255,255,255,0.22)" stroke-width="0.6"/>
    <text x="14" y="12" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">WCAM</text>
  </g>
</svg>
