<?xml version="1.0" encoding="UTF-8"?>
<!-- WCAM 2027 brand mark — primary (full colour) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="1024" height="1024">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f0606" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1f0606"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#tileGrad)"/>
  <rect x="7" y="7" width="66" height="66" rx="16" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.6"/>
  <path d="M 77 3 L 77 31 L 49 3 Z" fill="#7f1d1d"/>
  <g transform="scale(2.5)">
    <!-- Side-profile head silhouette (cognitive theme) -->
  <path d="M 7 24 L 7 15 C 7 10, 11 7, 16 8 C 20 9, 22 12, 22 15 L 23 17 L 22 18 L 22 21 C 22 22.5, 20.5 24, 18.5 24 Z" fill="#ffffff"/>
  <!-- Eye -->
  <circle cx="17" cy="14" r="0.7" fill="#1f0606"/>

  <!-- Pill capsule (substance) -->
  <g transform="translate(26 9) rotate(-25)">
    <rect x="-3.5" y="-1.4" width="7" height="2.8" rx="1.4" fill="#7f1d1d"/>
    <rect x="0" y="-1.4" width="3.5" height="2.8" rx="1.4" fill="rgba(255,255,255,0.4)"/>
  </g>
  <!-- Thought bubble dots between head and capsule -->
  <circle cx="24" cy="14" r="0.7" fill="#7f1d1d"/>
  <circle cx="22" cy="16" r="0.5" fill="#7f1d1d"/>
  </g>
  <g transform="translate(44 57)">
    <rect x="0" y="0" width="28" height="16" rx="4.5" fill="rgba(0,0,0,0.42)"/>
    <rect x="0" y="0" width="28" height="16" rx="4.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.5"/>
    <text x="14" y="12" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">WCAM</text>
  </g>
</svg>
