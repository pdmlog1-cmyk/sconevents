<?xml version="1.0" encoding="UTF-8"?>
<!-- GCCM 2027 brand mark — full color. Vector source; scales to any size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5a1f25"/>
      <stop offset="55%"  stop-color="#3a1419"/>
      <stop offset="100%" stop-color="#3a1419"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e8536e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8536e"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#tile)"/>
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#hi)"/>
  <rect x="7" y="7" width="66" height="66" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>

  <!-- Accent ribbon (top-right) -->
  <path d="M 77 3 L 77 31 L 49 3 Z" fill="url(#acc)"/>
  <path d="M 77 3 L 77 31 L 49 3 Z" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.6"/>

  <!-- Heart with ECG line -->
  <path d="M 40 60 L 20 40 C 12 28, 22 14, 32 20 C 36 22, 40 26, 40 26 C 40 26, 44 22, 48 20 C 58 14, 68 28, 60 40 L 40 60 Z" fill="#ffffff"/>
  <polyline points="16,42 26,42 30,34 34,50 38,30 42,46 64,46" stroke="#e8536e" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corner technical dots -->
  <circle cx="11" cy="11" r="1.2" fill="rgba(255,255,255,0.28)"/>
  <circle cx="11" cy="69" r="1.2" fill="rgba(255,255,255,0.18)"/>

  <!-- Initials chip -->
  <g transform="translate(44 57)">
    <rect x="0" y="0" width="28" height="16" rx="4.5" fill="rgba(0,0,0,0.42)" stroke="rgba(255,255,255,0.22)" stroke-width="0.6"/>
    <text x="14" y="12" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">GCCM</text>
  </g>
</svg>
