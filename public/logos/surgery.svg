<?xml version="1.0" encoding="UTF-8"?>
<!-- GCSA 2027 brand mark — Surgery. Vector source; scales to any size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1e40af"/>
      <stop offset="55%"  stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2563eb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%"   stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded tile -->
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#tile)"/>
  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#hi)"/>
  <rect x="7" y="7" width="66" height="66" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>

  <!-- Accent ribbon (top-right) -->
  <path d="M 77 3 L 77 31 L 49 3 Z" fill="url(#acc)"/>
  <path d="M 77 3 L 77 31 L 49 3 Z" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.6"/>

  <!-- Soft radial glow -->
  <ellipse cx="40" cy="40" rx="22" ry="22" fill="url(#glow)"/>

  <!-- Scalpel with medical cross -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="2">
    <path d="M 25 55 L 50 20 L 55 22 L 32 55 Z" fill="#ffffff"/>
    <rect x="22" y="52" width="14" height="8" rx="2" fill="#ffffff"/>
    <g stroke="#2563eb" stroke-width="3">
      <line x1="52" y1="40" x2="52" y2="56"/>
      <line x1="44" y1="48" x2="60" y2="48"/>
    </g>
  </g>

  <!-- Corner technical dots -->
  <circle cx="11" cy="11" r="1.2" fill="rgba(255,255,255,0.28)"/>
  <circle cx="11" cy="69" r="1.2" fill="rgba(255,255,255,0.18)"/>

  <!-- Initials chip -->
  <g transform="translate(44 57)">
    <rect x="0" y="0" width="28" height="16" rx="4.5" fill="rgba(0,0,0,0.42)" stroke="rgba(255,255,255,0.22)" stroke-width="0.6"/>
    <text x="14" y="12" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">GCSA</text>
  </g>
</svg>
